<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Chat - Local AI Voice Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 300;
        }

        .status {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
        }

        .status-dot.error {
            background: #f44336;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
        }

        .messages-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            overflow-y: auto;
            max-height: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .message {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 70%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            position: relative;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-content {
            background: #f1f3f4;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .play-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .input-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .input-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: #667eea;
        }

        .control-btn {
            padding: 1rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .send-btn {
            background: #667eea;
            color: white;
        }

        .send-btn:hover {
            background: #5a6fd8;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .mic-btn {
            background: #4CAF50;
            color: white;
        }

        .mic-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            font-style: italic;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee !important;
            color: #c62828 !important;
            border: 1px solid #ffcdd2;
        }

        .settings {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
        }

        .settings select {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 1rem;
            }
            
            .input-row {
                flex-direction: column;
                gap: 1rem;
            }
            
            .text-input {
                width: 100%;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Open Chat</h1>
        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="ollama-status"></div>
                <span>Ollama</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="tts-status"></div>
                <span id="tts-provider">TTS</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="stt-status"></div>
                <span>Speech Recognition</span>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="messages-container" id="messages">
            <div class="message assistant">
                <div class="message-content">
                    <div>👋 Hello! I'm your local AI assistant. You can type or speak to me, and I'll respond with both text and voice. How can I help you today?</div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-row">
                <input 
                    type="text" 
                    class="text-input" 
                    id="message-input" 
                    placeholder="Type your message or click the microphone to speak..."
                    maxlength="2000"
                >
                <button class="control-btn mic-btn" id="mic-btn" title="Click to speak">
                    🎤
                </button>
                <button class="control-btn send-btn" id="send-btn" title="Send message">
                    ➤
                </button>
            </div>
            
            <div class="settings">
                <label>Model:</label>
                <select id="model-select">
                    <option value="llama3.2">llama3.2</option>
                    <option value="llama3">llama3</option>
                    <option value="mistral">mistral</option>
                    <option value="codellama">codellama</option>
                </select>
                
                <label>TTS:</label>
                <select id="tts-select">
                    <option value="elevenlabs">ElevenLabs</option>
                    <option value="pyttsx3">Local (pyttsx3)</option>
                </select>
                
                <label>Voice:</label>
                <select id="voice-select">
                    <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Default)</option>
                    <option value="AZnzlk1XvdvUeBnXmlld">Domi</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Bella</option>
                    <option value="ErXwobaYiN019PkySvjV">Antoni</option>
                    <option value="MF3mGyEYCl7XYWbV9V6O">Elli</option>
                    <option value="TxGEqnHWrfWFTfGW9XjX">Josh</option>
                    <option value="VR6AewLTigWG4xSOukaG">Arnold</option>
                    <option value="pNInz6obpgDQGcFmaJgB">Adam</option>
                    <option value="yoZ06aMxZJJ28mfd3POQ">Sam</option>
                    <option value="29vD33N1CtxCmqQRPOHJ">Drew</option>
                    <option value="IKne3meq5aSn9XLyUdCD">Paul</option>
                    <option value="JBFqnCBsd6RMkjVDRZzb">George</option>
                    <option value="N2lVS1w4EtoT3dr4eOWO">Callum</option>
                    <option value="onwK4e9ZLuTAKqWW03F9">Daniel</option>
                </select>
            </div>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
